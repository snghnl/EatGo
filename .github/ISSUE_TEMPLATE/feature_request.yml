name: Feature Request
description: Suggest an improvement or new feature
title: "feature: "
labels: [enhancement]
assignees: []
body:
    - type: markdown
      attributes:
          value: |
              ## Enhancement Request
              Help us understand your idea and how it could improve the project.

    - type: input
      id: summary
      attributes:
          label: Feature Summary
          description: A quick summary of the feature
          placeholder: e.g. "Add dark mode support"
      validations:
          required: true

    - type: textarea
      id: problem
      attributes:
          label: Problem Statement
          description: Is your feature request related to a problem? Please describe.
          placeholder: "I’m frustrated when..."
      validations:
          required: false

    - type: textarea
      id: solution
      attributes:
          label: Proposed Solution
          description: A clear and concise description of what you want to happen.
      validations:
          required: true

    - type: textarea
      id: alternatives
      attributes:
          label: Alternatives Considered
          description: Have you considered alternative solutions?
      validations:
          required: false

    - type: textarea
      id: context
      attributes:
          label: Additional Context
          description: Any other context, links, or screenshots
      validations:
          required: false
