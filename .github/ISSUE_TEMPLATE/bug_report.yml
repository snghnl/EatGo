name: 🐞 Bug Report
description: Report something that isn't working as expected
title: "bug: "
labels: [bug]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## Bug Report
        Please provide detailed information about the issue you're experiencing.

  - type: input
    id: summary
    attributes:
      label: Short Summary
      description: A quick explanation of the bug
      placeholder: e.g. "Login fails with 500 error"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Describe how to reproduce the issue step-by-step
      placeholder: |
        1. Go to the login page
        2. Enter invalid credentials (e.g., "user@example.com" and "wrongpassword")
        3. Click the submit button
        4. Observe the error message
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Logs
      description: If applicable, add screenshots or log output
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, browser, version, etc.
      placeholder: e.g. "macOS 14, Chrome 115, App v1.2.3"
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other information or context
    validations:
      required: false
